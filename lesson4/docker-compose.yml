services:
  postgres:
    image: postgres:16
    container_name: lesson4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lesson4_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata_lesson4:/var/lib/postgresql/data

volumes:
  pgdata_lesson4:
