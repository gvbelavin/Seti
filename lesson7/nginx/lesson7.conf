geo $is_ru_ip {
    default 0;

    # Demo list of Russian IP prefixes.
    # Extend this list for production usage.
    5.8.0.0/13 1;
    5.32.0.0/11 1;
    31.128.0.0/10 1;
    37.9.0.0/16 1;
    46.17.40.0/21 1;
    62.33.0.0/16 1;
    77.88.0.0/18 1;
    78.24.0.0/13 1;
    79.133.64.0/18 1;
    87.250.224.0/19 1;
    89.108.64.0/18 1;
    93.158.128.0/18 1;
    95.24.0.0/13 1;
    109.207.0.0/16 1;
    176.192.0.0/10 1;
    178.248.232.0/21 1;
    185.32.184.0/22 1;
    188.114.0.0/16 1;
    194.85.0.0/16 1;
    213.180.192.0/19 1;
}

server {
    listen 80;
    server_name _;

    location = /stub {
        default_type text/plain;
        return 200 "ВАМ СЮДА НЕЛЬЗЯ";
    }

    location / {
        if ($is_ru_ip = 1) {
            return 302 /stub;
        }

        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
